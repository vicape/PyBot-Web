name: PyBot CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Compile MicroPython runtime sources
        run: python -m compileall -q firmware/pybot-ble-runtime

      - name: Native BLE Stop regression tests
        run: timeout 30s node --test test/nativeBleUrgentStop.test.mjs

      - name: Run full test suite
        run: timeout 180s npm test

      - name: Build
        run: npm run build
