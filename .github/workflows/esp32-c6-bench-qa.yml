name: PyBot C6 Zigbee Feature QA

on:
  push:
    branches:
      - feature/esp32-universal-lab
    paths:
      - "src/esp32UniversalLab/**"
      - "src/C6ZigbeeBenchModal.jsx"
      - "src/PyBotIDE.jsx"
      - "test/**"
      - ".github/workflows/esp32-c6-bench-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pybot-c6-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      # The QA harness is transient; protected product snapshots must not be
      # weakened just because this temporary workflow exists during validation.
      - name: Isolate temporary CI harness from product tests
        run: |
          mkdir -p "$RUNNER_TEMP/c6-ci"
          mv .github/workflows/esp32-c6-bench-qa.yml "$RUNNER_TEMP/c6-ci/esp32-c6-bench-qa.yml"
          rmdir .github/workflows
      - name: Focused Zigbee safety and test suite registry
        run: node --test test/esp32UniversalLabC6ZigbeeBench.test.mjs test/testSuiteManifest.test.mjs
      - name: Canonical complete tests
        run: npm run test:full
      - name: Frontend build (validation only, no deployment)
        run: npm run build
      - name: Restore CI harness
        if: always()
        run: |
          mkdir -p .github/workflows
          cp "$RUNNER_TEMP/c6-ci/esp32-c6-bench-qa.yml" .github/workflows/esp32-c6-bench-qa.yml
      - name: Restore only known test-generated tracked Python bytecode
        run: |
          mapfile -t touched < <(git diff --name-only)
          for path in "${touched[@]}"; do
            case "$path" in
              firmware/pybot-ble-runtime/__pycache__/*.pyc)
                git restore -- "$path"
                ;;
            esac
          done
      - name: Source integrity (no tracked mutation)
        run: git diff --exit-code
