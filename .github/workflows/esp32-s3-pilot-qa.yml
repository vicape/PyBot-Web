name: ESP32-S3 isolated USB pilot QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/esp32/**'
      - 'src/esp32RunTarget.js'
      - 'src/hardwareBridge.js'
      - 'src/PyBotIDE.jsx'
      - 'src/examplesData.js'
      - 'src/i18n.js'
      - 'test/**'
      - 'docs/ESP32_S3_USB_PILOT.md'
      - '.github/workflows/esp32-s3-pilot-qa.yml'

permissions:
  contents: read

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install existing dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: S3 isolated hardware and firmware guardrails
        run: node --test test/esp32S3Support.test.mjs
      - name: Existing hardware contracts (report separately)
        id: contracts
        continue-on-error: true
        run: npm run test:contracts
      - name: Existing architecture contracts (report separately)
        id: architecture
        continue-on-error: true
        run: npm run test:architecture
      - name: Existing application regressions (report separately)
        id: application
        continue-on-error: true
        run: npm run test:fast
      - name: Production build (no deployment)
        id: build
        continue-on-error: true
        run: npm run build
      - name: Fail closed if any suite or build is not green
        if: always()
        env:
          CONTRACTS: ${{ steps.contracts.outcome }}
          ARCHITECTURE: ${{ steps.architecture.outcome }}
          APPLICATION: ${{ steps.application.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          echo "contracts=$CONTRACTS architecture=$ARCHITECTURE application=$APPLICATION build=$BUILD"
          test "$CONTRACTS" = "success"
          test "$ARCHITECTURE" = "success"
          test "$APPLICATION" = "success"
          test "$BUILD" = "success"
